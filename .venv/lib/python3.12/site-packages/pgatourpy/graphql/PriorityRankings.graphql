query PriorityRankings($tourCode: TourCode!, $year: Int) {
  priorityRankings(tourCode: $tourCode, year: $year) {
    tourCode
    year
    displayYear
    throughText
    yearPills {
      year
      displaySeason
    }
    categories {
      displayName
      detail
      players {
        playerId
        displayName
      }
    }
  }
}
